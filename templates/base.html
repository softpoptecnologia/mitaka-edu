{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="manifest" href="/static/pwa/manifest.json">
  <link rel="apple-touch-icon" href="/static/pwa/icon-192.png">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/brand.css' %}?v=brand9">
  <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body {
      background-color: var(--canvas);
      color: var(--ink);
      font-family: Poppins, "Segoe UI", system-ui, sans-serif;
    }
    h1, .h1 { font-weight: 700; }
    h2, .h2 { font-weight: 600; }
    h3, .h3 { font-weight: 500; }
    .btn-primary {
      --bs-btn-bg: var(--brand-strong);
      --bs-btn-border-color: var(--brand-strong);
      --bs-btn-hover-bg: var(--brand-dark);
      --bs-btn-hover-border-color: var(--brand-dark);
      --bs-btn-active-bg: var(--brand-dark);
      --bs-btn-active-border-color: var(--brand-dark);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--brand-strong);
      --bs-btn-border-color: var(--brand-strong);
      --bs-btn-hover-bg: var(--brand-strong);
      --bs-btn-hover-border-color: var(--brand-strong);
      --bs-btn-hover-color: #fff;
    }
    .text-primary { color: var(--brand-strong) !important; }
    .bg-primary { background-color: var(--brand-strong) !important; }
    .border-primary { border-color: var(--brand-strong) !important; }
    a { color: var(--brand-strong); }
    a:hover { color: var(--brand-dark); }
    .card {
      border-color: var(--line);
      background: var(--surface);
    }
    .card-header {
      background-color: var(--canvas);
      border-bottom-color: var(--line);
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
  {% if messages %}
  <div class="container-fluid px-3 pt-3" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <div id="conteudo-principal">
  {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/static/pwa/sw.js').catch(function () {});
      });
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>

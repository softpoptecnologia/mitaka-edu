<form method="get" class="filter-bar no-print" aria-label="Filtros da secretaria">
  <div class="row g-2 align-items-end">
    <div class="col-6 col-lg-2">
      <label class="form-label" for="ano">Ano letivo</label>
      <select class="form-select form-select-sm" id="ano" name="ano">
        {% for y in years %}
        <option value="{{ y.pk }}" {% if year and y.pk == year.pk %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="escola">Escola</label>
      <select class="form-select form-select-sm" id="escola" name="escola" onchange="this.form.submit()">
        <option value="">Todas</option>
        {% for school in schools %}
        <option value="{{ school.pk }}" {% if filters.school and filters.school.pk == school.pk %}selected{% endif %}>{{ school.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="turma">Turma</label>
      <select class="form-select form-select-sm" id="turma" name="turma" {% if not classroom_choices %}disabled title="Selecione uma escola"{% endif %}>
        <option value="">{% if classroom_choices %}Todas{% else %}Selecione a escola{% endif %}</option>
        {% for room in classroom_choices %}
        <option value="{{ room.pk }}" {% if filters.classroom and filters.classroom.pk == room.pk %}selected{% endif %}>{{ room.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="serie">Série</label>
      <select class="form-select form-select-sm" id="serie" name="serie">
        <option value="">Todas</option>
        {% for grade in grade_choices %}
        <option value="{{ grade }}" {% if filters.grade == grade %}selected{% endif %}>{{ grade }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="habilidade">Habilidade</label>
      <select class="form-select form-select-sm" id="habilidade" name="habilidade">
        <option value="">Todas</option>
        {% for skill in skills %}
        <option value="{{ skill.pk }}" {% if filters.skill and filters.skill.pk == skill.pk %}selected{% endif %}>{{ skill.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label" for="recorte">Recorte</label>
      <select class="form-select form-select-sm" id="recorte" name="recorte">
        <option value="all" {% if filters.recorte == 'all' %}selected{% endif %}>Geral</option>
        <option value="atencao" {% if filters.recorte == 'atencao' %}selected{% endif %}>Em atenção</option>
        <option value="acesso" {% if filters.recorte == 'acesso' %}selected{% endif %}>Com recurso de acesso</option>
      </select>
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="submit" class="btn btn-sm btn-accent">Aplicar filtros</button>
    <a href="?" class="btn btn-sm btn-outline-secondary">Limpar</a>
    <a href="?{{ filter_qs }}{% if filter_qs %}&{% endif %}formato=pdf" class="btn btn-sm btn-outline-dark ms-auto">Exportar PDF deste recorte</a>
  </div>
</form>

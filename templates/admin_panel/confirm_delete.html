{% extends "admin_panel/base_admin.html" %}

{% block page_title %}Excluir registro{% endblock %}

{% block admin_content %}
<div class="panel" style="max-width: 36rem;">
  <div class="panel-header">Confirmar exclusão</div>
  <div class="panel-body p-3">
    <p>Excluir <strong>{{ object_label }}</strong>?</p>
    {% if warning %}
    <p class="text-muted small mb-3">{{ warning }}</p>
    {% endif %}
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Excluir definitivamente</button>
      <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}

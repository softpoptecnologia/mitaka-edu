{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/app.css' %}?v=ui12">
<style>
  :root {
    --brand: #0d6e6e;
    --brand-dark: #0a5555;
    --cream: #f6f3ee;
    --ink: #1f2a2a;
    --muted: #5c6b6b;
    --ok: #2f7d4a;
    --attention: #b7791f;
    --coral: #e07a5f;
    --sky: #3d7ea6;
  }
  .teacher-shell { max-width: 1120px; margin: 0 auto; }
  .today-hero { padding: 0.15rem 0 0.25rem; }
  .today-kicker { color: var(--muted); font-weight: 700; font-size: 1rem; }
  .today-title { font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .today-sub { color: var(--muted); font-weight: 700; }
  .today-stack { display: grid; gap: 0.85rem; }
  .today-card {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-left: 5px solid var(--brand);
    border-radius: 18px;
    padding: 1.05rem 1.1rem;
    box-shadow: 0 8px 24px rgba(20, 48, 44, 0.04);
    color: var(--ink);
  }
  .today-card-high { border-left-color: var(--coral); }
  .today-card-medium { border-left-color: var(--attention); }
  .today-card-low { border-left-color: #8a9494; }
  .today-card-top { display: flex; align-items: flex-start; gap: 0.9rem; margin-bottom: 0.95rem; }
  .today-count {
    min-width: 3rem; height: 3rem; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.35rem; background: #e6f3f3; color: var(--brand); flex-shrink: 0;
  }
  .today-card-high .today-count { background: #fdeee9; color: #9a3f28; }
  .today-card-medium .today-count { background: #fff4e0; color: #9a5b00; }
  .today-card-low .today-count { background: #f1f1f1; color: #5f6b6b; }
  .today-copy { min-width: 0; flex: 1; }
  .today-card-kicker {
    display: inline-flex; align-items: center; gap: 0.4rem;
    color: var(--muted); font-size: 0.82rem; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .today-card-title { font-size: 1.15rem; font-weight: 800; line-height: 1.35; margin: 0 0 0.35rem; color: var(--ink); }
  .today-card-desc { color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
  .today-card-btn, .today-cta {
    width: 100%; min-height: 3rem; padding: 0.85rem 1rem; font-size: 1.02rem; font-weight: 800; border-radius: 14px;
  }
  .classroom-tile {
    background: #fff; border: 1px solid #e5e1d8; border-radius: 16px; border-left: 4px solid var(--sky);
    padding: 1.15rem 1.2rem; height: 100%; box-shadow: 0 8px 24px rgba(20, 48, 44, 0.04);
  }
  .classroom-tile h2 { font-size: 1.15rem; font-weight: 800; }
  .section-card {
    background: #fff; border: 1px solid #e5e1d8; border-radius: 16px; border-top: 4px solid var(--brand);
    box-shadow: 0 8px 24px rgba(20, 48, 44, 0.04); overflow: hidden;
  }
  .section-card-header, .section-card .card-header {
    background: #f7faf8; border-bottom: 1px solid #e5e1d8; font-weight: 800;
    display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.1rem;
  }
  .section-icon {
    width: 2rem; height: 2rem; border-radius: 10px; background: #fff; color: var(--brand);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.28rem 0.7rem;
    border-radius: 999px; font-size: 0.75rem; font-weight: 800; white-space: nowrap;
  }
  .status-pill-planned { background: #fff4e0; color: #9a5b00; }
  .status-pill-in_progress { background: #e6f3f3; color: var(--brand); }
  .status-pill-completed { background: #e8f5ec; color: var(--ok); }
  .status-pill-cancelled { background: #f1f1f1; color: #5f6b6b; }
  .status-pill-attention { background: #fdeee9; color: #9a3f28; }
  .status-pill-ok { background: #e8f5ec; color: var(--ok); }
  .followup-choice {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem;
    border: 1px solid #e5e1d8; border-radius: 14px; font-weight: 700; min-height: 3.2rem;
  }
  .followup-choice:has(input:checked) { border-color: var(--brand); background: #f3fafa; }
  .followup-choice input { width: 1.2rem; height: 1.2rem; }
  .teacher-nav {
    background: var(--mitaka-teal);
    box-shadow: 0 2px 12px rgba(13, 110, 110, 0.18);
  }
  .teacher-nav .navbar-brand,
  .teacher-nav .nav-link {
    color: #fff !important;
    font-weight: 700;
  }
  .teacher-nav .navbar-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .teacher-nav .brand-mark {
    width: 1.85rem;
    height: 1.85rem;
    border-radius: 10px;
    background: #f4c95d;
    color: #14302c;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .teacher-nav .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    opacity: 0.9;
  }
  .teacher-nav .nav-link:hover {
    color: var(--mitaka-cream) !important;
    opacity: 1;
  }
  .teacher-nav .nav-link.active {
    opacity: 1;
    border-bottom: 2px solid #f4c95d;
  }
  .teacher-main {
    min-height: calc(100vh - 56px);
  }
  .status-badge .badge-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .status-badge-ok .badge-icon { background: #d4edda; color: #155724; }
  .status-badge-pending .badge-icon { background: #fff3cd; color: #856404; }
  .status-badge-attention .badge-icon { background: #f8d7da; color: #721c24; }
  .status-badge .badge-label { font-size: 0.875rem; color: var(--mitaka-muted); }
  .chrono { list-style: none; margin: 0; padding: 0; }
  .chrono-group { margin: .15rem 0 .7rem 1.9rem; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #5c6b6b; }
  .chrono-item { display: flex; gap: .85rem; padding-bottom: 1rem; }
  .chrono-item:last-child { padding-bottom: 0; }
  .chrono-rail { position: relative; width: .9rem; flex-shrink: 0; }
  .chrono-rail::before { content: ""; position: absolute; left: 50%; top: .7rem; bottom: -1rem; width: 2px; background: #d7ecec; transform: translateX(-50%); }
  .chrono-item:last-child .chrono-rail::before { display: none; }
  .chrono-dot { position: relative; z-index: 1; display: block; width: .85rem; height: .85rem; margin-top: .28rem; border-radius: 50%; background: #0d6e6e; box-shadow: 0 0 0 4px #e6f3f3; }
  .chrono-item-completed .chrono-dot, .chrono-item-ok .chrono-dot { background: #2f7d4a; }
  .chrono-item-planned .chrono-dot, .chrono-item-draft .chrono-dot { background: #b7791f; }
  .chrono-item-sky .chrono-dot { background: #3d7ea6; }
  .chrono-item-cancelled .chrono-dot, .chrono-item-archived .chrono-dot { background: #8a9494; }
  .chrono-main { min-width: 0; flex: 1; }
  .chrono-when { display: block; font-size: .82rem; font-weight: 800; color: #5c6b6b; margin-bottom: .4rem; }
  .chrono-card { background: #fbfaf7; border: 1px solid #e5e1d8; border-radius: 14px; padding: .9rem 1rem; }
  .chrono-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .7rem; margin-bottom: .35rem; }
  .chrono-title { font-weight: 800; line-height: 1.4; }
  .chrono-text { margin: 0; line-height: 1.5; color: #5c6b6b; }
  .chrono-meta { display: flex; flex-wrap: wrap; gap: .3rem .85rem; color: #5c6b6b; font-size: .82rem; margin-top: .45rem; }
  .chrono-meta strong { color: #1f2a2a; font-weight: 800; }
  .chrono-actions { margin-top: .75rem; }
  .instrument-card { padding: 1rem 1.1rem; height: auto; }
</style>
{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg teacher-nav">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand fw-semibold" href="{% url 'teacher:home' %}">
      <span class="brand-mark" aria-hidden="true"><i class="bi bi-mortarboard-fill"></i></span>
      {{ APP_NAME }}
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#teacherNav" aria-controls="teacherNav" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>
    <div class="collapse navbar-collapse" id="teacherNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'today' %} active{% endif %}" href="{% url 'teacher:today' %}">
            <i class="bi bi-house-heart" aria-hidden="true"></i> Hoje
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if 'classroom' in request.resolver_match.url_name %} active{% endif %}" href="{% url 'teacher:classrooms' %}">
            <i class="bi bi-easel2" aria-hidden="true"></i> Minhas turmas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'logout' %}">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main class="teacher-main py-4">
  <div class="teacher-shell px-3 px-lg-4">
    {% block teacher_content %}{% endblock %}
  </div>
</main>
{% endblock %}

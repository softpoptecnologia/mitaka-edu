{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6e6e">
  <title>{% block title %}Avaliação — {{ APP_NAME }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
  <style>
    :root {
      --play-teal: #0d6e6e;
      --play-teal-light: #149494;
      --play-cream: #faf8f5;
      --play-sun: #f4c542;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(160deg, var(--play-cream) 0%, #e8f4f4 50%, #fff 100%);
      font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
